# whole project:  docker compose up -d --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hpai
      POSTGRES_PASSWORD: hpai
      POSTGRES_DB: hpai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpai"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://hpai:hpai@db:5432/hpai
      SEED_DEMO_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
